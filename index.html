<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerbHero - Vokabeltrainer</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        body { font-family: 'Fredoka', sans-serif; background-color: #f8fafc; color: #1e293b; user-select: none; }
        .arcade-btn { transition: all 0.1s ease; box-shadow: 0 4px 0 #cbd5e1; cursor: pointer; }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e1; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

    <!-- HEADER / DASHBOARD -->
    <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center mb-4">
        <div>
            <h1 class="text-xl font-bold text-indigo-600">VerbHero 🦸‍♂️</h1>
            <p class="text-xs text-slate-400" id="current-selection-label">Hauptmenü</p>
        </div>
        <div class="flex gap-2">
            <div class="bg-amber-50 border border-amber-200 px-3 py-1 rounded-xl flex items-center gap-1">
                <span class="text-amber-500 font-bold" id="xp-display">0</span>
                <span class="text-xs text-amber-600 uppercase font-bold">XP</span>
            </div>
            <div class="bg-purple-50 border border-purple-200 px-3 py-1 rounded-xl flex items-center gap-1">
                <span class="text-purple-600 font-bold" id="token-display">0</span>
                <span class="text-xs text-purple-600">🪙</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main id="app-container" class="flex-1 flex flex-col justify-center">
        
        <!-- 1. HAUPTMENÜ -->
        <div id="mode-select-screen" class="space-y-3">
            <h2 class="text-center text-slate-600 font-bold mb-3">Wähle deinen Spielmodus!</h2>
            
            <button onclick="openCategoryScreen('match')" class="w-full bg-indigo-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🧩 Triple Match</span>
                <span class="text-sm bg-indigo-600 px-2 py-1 rounded-lg">3 Formen / Match</span>
            </button>
            <button onclick="openCategoryScreen('detective')" class="w-full bg-emerald-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🔍 Lücken-Detektiv</span>
                <span class="text-sm bg-emerald-600 px-2 py-1 rounded-lg">Sätze</span>
            </button>
            <button onclick="openCategoryScreen('listening')" class="w-full bg-sky-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🎧 Hör-Trainer</span>
                <span class="text-sm bg-sky-600 px-2 py-1 rounded-lg">Audio</span>
            </button>
            <button onclick="startRunner()" class="w-full bg-rose-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>♞ Springer Arcade</span>
                <span class="text-sm bg-rose-600 px-2 py-1 rounded-lg">1 🪙 Kosten</span>
            </button>
        </div>

        <!-- 2. KATEGORIE-AUSWAHL -->
        <div id="category-screen" class="hidden space-y-3">
            <h2 class="text-center text-slate-600 font-bold mb-3">Was möchtest du üben?</h2>
            
            <button onclick="startLearning('verbs')" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>⚡ Irregular Verbs</span>
                <span class="text-sm bg-indigo-700 px-2 py-1 rounded-lg">24 Verben (3 Formen)</span>
            </button>
            <button onclick="startLearning('unit1')" class="w-full bg-teal-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>📚 Vokabeln: Unit 1</span>
                <span class="text-sm bg-teal-600 px-2 py-1 rounded-lg">Schule & Alltag</span>
            </button>
            <button onclick="startLearning('unit2')" class="w-full bg-cyan-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>📚 Vokabeln: Unit 2</span>
                <span class="text-sm bg-cyan-600 px-2 py-1 rounded-lg">Hobby & Freizeit</span>
            </button>
        </div>

        <!-- 3. SPIELBEREICH -->
        <div id="game-screen" class="hidden flex flex-col items-center justify-center"></div>
    </main>

    <!-- FOOTER NAVIGATION -->
    <footer class="mt-4 flex justify-between items-center px-2">
        <button onclick="returnToMain()" id="back-btn" class="text-sm bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold hidden">⬅️ Hauptmenü</button>
        <p class="text-xs text-slate-400 ml-auto">VerbHero PWA</p>
    </footer>

    <!-- JAVASCRIPT LOGIK -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
            });
        }

        function speakWord(text) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.log('Audio Error:', e);
            }
        }

        const wordPools = {
            verbs: [
                { base: "be", past: "was/were", pp: "been", de: "sein", sentence: "He ___ happy yesterday." },
                { base: "go", past: "went", pp: "gone", de: "gehen", sentence: "She ___ to school." },
                { base: "see", past: "saw", pp: "seen", de: "sehen", sentence: "I ___ a cute dog." },
                { base: "eat", past: "ate", pp: "eaten", de: "essen", sentence: "They ___ an apple." },
                { base: "make", past: "made", pp: "made", de: "machen", sentence: "We ___ a cake." },
                { base: "run", past: "ran", pp: "run", de: "laufen", sentence: "He ___ very fast." },
                { base: "take", past: "took", pp: "taken", de: "nehmen", sentence: "She ___ her bag." },
                { base: "write", past: "wrote", pp: "written", de: "schreiben", sentence: "I ___ a letter." },
                { base: "give", past: "gave", pp: "given", de: "geben", sentence: "You ___ me a gift." },
                { base: "come", past: "came", pp: "come", de: "kommen", sentence: "They ___ home." },
                { base: "have", past: "had", pp: "had", de: "haben", sentence: "He ___ a cat." },
                { base: "do", past: "did", pp: "done", de: "tun / machen", sentence: "She ___ her homework." },
                { base: "buy", past: "bought", pp: "bought", de: "kaufen", sentence: "We ___ a new car." },
                { base: "catch", past: "caught", pp: "caught", de: "fangen", sentence: "He ___ the ball." },
                { base: "find", past: "found", pp: "found", de: "finden", sentence: "I ___ my keys." },
                { base: "get", past: "got", pp: "gotten", de: "bekommen", sentence: "She ___ a present." },
                { base: "know", past: "knew", pp: "known", de: "wissen", sentence: "He ___ the answer." },
                { base: "speak", past: "spoke", pp: "spoken", de: "sprechen", sentence: "They ___ English." },
                { base: "break", past: "broke", pp: "broken", de: "brechen", sentence: "He ___ the stick." },
                { base: "drink", past: "drank", pp: "drunk", de: "trinken", sentence: "She ___ water." },
                { base: "fly", past: "flew", pp: "flown", de: "fliegen", sentence: "Birds ___ high." },
                { base: "sing", past: "sang", pp: "sung", de: "singend", sentence: "We ___ a song." },
                { base: "swim", past: "swam", pp: "swum", de: "schwimmen", sentence: "He ___ in the pool." },
                { base: "think", past: "thought", pp: "thought", de: "denken", sentence: "I ___ about it." }
            ],
            unit1: [
                { base: "schoolbag", target: "schoolbag", de: "Schultasche", sentence: "I put books in my ___." },
                { base: "pencil", target: "pencil", de: "Bleistift", sentence: "I write with a ___." },
                { base: "rubber", target: "rubber", de: "Radiergummi", sentence: "I need a ___ to fix mistakes." },
                { base: "ruler", target: "ruler", de: "Lineal", sentence: "Draw a line with a ___." },
                { base: "teacher", target: "teacher", de: "Lehrer/in", sentence: "The ___ helps us." }
            ],
            unit2: [
                { base: "football", target: "football", de: "Fußball", sentence: "We play ___ outside." },
                { base: "bike", target: "bike", de: "Fahrrad", sentence: "I ride my ___." },
                { base: "book", target: "book", de: "Buch", sentence: "She reads a good ___." },
                { base: "paint", target: "paint", de: "malen", sentence: "I like to ___ pictures." }
            ]
        };

        let selectedGame = 'match';
        let currentCategory = 'verbs';
        let currentItems = wordPools.verbs;
        let state = { xp: 0, tokens: 0 };

        function openCategoryScreen(gameMode) {
            selectedGame = gameMode;
            document.getElementById('mode-select-screen').classList.add('hidden');
            document.getElementById('category-screen').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('current-selection-label').innerText = "Modus wählen";
        }

        function startLearning(categoryKey) {
            currentCategory = categoryKey;
            currentItems = wordPools[categoryKey];
            let catName = categoryKey === 'verbs' ? 'Irregular Verbs' : categoryKey.toUpperCase();
            document.getElementById('current-selection-label').innerText = catName + " (" + selectedGame.toUpperCase() + ")";
            
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            if (selectedGame === 'match') initMatchGame();
            else if (selectedGame === 'detective') initDetectiveGame();
            else if (selectedGame === 'listening') initListeningGame();
        }

        function returnToMain() {
            document.getElementById('mode-select-screen').classList.remove('hidden');
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('current-selection-label').innerText = "Hauptmenü";
            if(window.currentGameInterval) clearInterval(window.currentGameInterval);
        }

        function addXP(xpEarned) {
            let previousTokens = Math.floor(state.xp / 100);
            state.xp += xpEarned;
            let currentTokens = Math.floor(state.xp / 100);
            if (currentTokens > previousTokens) {
                state.tokens += (currentTokens - previousTokens);
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('xp-display').innerText = state.xp;
            document.getElementById('token-display').innerText = state.tokens;
        }

        function initMatchGame() {
            const container = document.getElementById('game-screen');
            const item = currentItems[Math.floor(Math.random() * currentItems.length)];

            if (currentCategory === 'verbs') {
                // TRIPLE MATCH für Unregelmäßige Verben (Grundform, Simple Past, Past Participle)
                speakWord(item.base);
                let correctCombination = `${item.base} ➔ ${item.past} ➔ ${item.pp}`;

                container.innerHTML = `
                    <div class="text-center space-y-4 w-full">
                        <h3 class="font-bold text-slate-700">Finde die 3 Formen für: <span class="text-indigo-600 text-xl">${item.de}</span></h3>
                        <button onclick="speakWord('${item.base}')" class="bg-sky-100 text-sky-600 px-3 py-1 rounded-full text-sm font-bold">🔊 Anhören</button>
                        <div class="grid grid-cols-1 gap-2 mt-4" id="options"></div>
                    </div>
                `;

                const optionsContainer = document.getElementById('options');
                let choices = [correctCombination];
                while(choices.length < 4) {
                    let r1 = currentItems[Math.floor(Math.random() * currentItems.length)];
                    let combo = `${r1.base} ➔ ${r1.past} ➔ ${r1.pp}`;
                    if(!choices.includes(combo)) choices.push(combo);
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "bg-white border-2 border-slate-200 p-3 rounded-2xl font-bold text-sm hover:border-indigo-500 arcade-btn w-full";
                    btn.innerText = choice;
                    btn.onclick = () => {
                        if(choice === correctCombination) {
                            addXP(15);
                            initMatchGame();
                        } else {
                            btn.classList.add('bg-rose-50', 'border-rose-300');
                        }
                    };
                    optionsContainer.appendChild(btn);
                });

            } else {
                // Normales Match für Vokabel-Units (Wort & Übersetzung)
                speakWord(item.base);
                container.innerHTML = `
                    <div class="text-center space-y-4 w-full">
                        <h3 class="font-bold text-slate-700">Finde die Übersetzung für: <span class="text-indigo-600 text-xl">${item.de}</span></h3>
                        <button onclick="speakWord('${item.base}')" class="bg-sky-100 text-sky-600 px-3 py-1 rounded-full text-sm font-bold">🔊 Anhören</button>
                        <div class="grid grid-cols-2 gap-3 mt-4" id="options"></div>
                    </div>
                `;

                const optionsContainer = document.getElementById('options');
                let choices = [item.target];
                while(choices.length < 4) {
                    let randomItem = currentItems[Math.floor(Math.random() * currentItems.length)].target;
                    if(!choices.includes(randomItem)) choices.push(randomItem);
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "bg-white border-2 border-slate-200 p-4 rounded-2xl font-bold text-lg hover:border-indigo-500 arcade-btn";
                    btn.innerText = choice;
                    btn.onclick = () => {
                        if(choice === item.target) {
                            addXP(10);
                            initMatchGame();
                        } else {
                            btn.classList.add('bg-rose-50', 'border-rose-300');
                        }
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function initDetectiveGame() {
            const container = document.getElementById('game-screen');
            const item = currentItems[Math.floor(Math.random() * currentItems.length)];
            let targetValue = currentCategory === 'verbs' ? item.past : item.target;
            
            container.innerHTML = `
                <div class="text-center space-y-4 w-full">
                    <h3 class="font-bold text-slate-700">Setze das Wort ein (${item.de}):</h3>
                    <div class="text-xl font-bold text-indigo-600 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">${item.sentence}</div>
                    <div class="grid grid-cols-2 gap-3 mt-4" id="detective-options"></div>
                </div>
            `;

            const optionsContainer = document.getElementById('detective-options');
            let choices = [targetValue];
            while(choices.length < 4) {
                let rItem = currentItems[Math.floor(Math.random() * currentItems.length)];
                let val = currentCategory === 'verbs' ? rItem.past : rItem.target;
                if(!choices.includes(val)) choices.push(val);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-slate-200 p-4 rounded-2xl font-bold text-lg hover:border-emerald-500 arcade-btn";
                btn.innerText = choice;
                btn.onclick = () => {
                    if(choice === targetValue) {
                        addXP(15);
                        initDetectiveGame();
                    } else {
                        btn.classList.add('bg-rose-50', 'border-rose-300');
                    }
                };
                optionsContainer.appendChild(btn);
            });
        }

        function initListeningGame() {
            const container = document.getElementById('game-screen');
            const item = currentItems[Math.floor(Math.random() * currentItems.length)];
            
            container.innerHTML = `
                <div class="text-center space-y-4 w-full">
                    <h3 class="font-bold text-slate-700">Welches Wort hörst du?</h3>
                    <button onclick="speakWord('${item.base}')" class="bg-indigo-600 text-white p-6 rounded-full text-3xl shadow-lg mx-auto w-24 h-24 flex items-center justify-center arcade-btn">🔊</button>
                    <div class="grid grid-cols-2 gap-3 mt-4" id="listening-options"></div>
                </div>
            `;
            setTimeout(() => speakWord(item.base), 300);

            const optionsContainer = document.getElementById('listening-options');
            let choices = [item.base];
            while(choices.length < 4) {
                let r = currentItems[Math.floor(Math.random() * currentItems.length)].base;
                if(!choices.includes(r)) choices.push(r);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-slate-200 p-3 rounded-2xl font-bold text-sm hover:border-sky-500 arcade-btn";
                btn.innerText = choice;
                btn.onclick = () => {
                    if(choice === item.base) {
                        addXP(15);
                        initListeningGame();
                    } else {
                        btn.classList.add('bg-rose-50', 'border-rose-300');
                    }
                };
                optionsContainer.appendChild(btn);
            });
        }

        function startRunner() {
            if (state.tokens < 1) {
                alert("Du brauchst mindestens 1 🪙 Token, um Springer Arcade zu spielen!\n\nLerne zuerst Vokabeln im Hauptmenü, um XP und Token zu sammeln!");
                return;
            }
            state.tokens--;
            updateHUD();

            document.getElementById('mode-select-screen').classList.add('hidden');
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('current-selection-label').innerText = "Springer Arcade 🪙";

            initRunnerGame();
        }

        function initRunnerGame() {
            const container = document.getElementById('game-screen');
            container.innerHTML = `
                <div class="text-center w-full">
                    <canvas id="runnerCanvas" width="320" height="200" class="bg-slate-900 rounded-2xl shadow-inner mx-auto border-4 border-slate-800"></canvas>
                    <p class="text-xs text-slate-400 mt-2">Tippe oder Leertaste zum Springen! Entspanntes Tempo.</p>
                </div>
            `;
            const canvas = document.getElementById('runnerCanvas');
            const ctx = canvas.getContext('2d');
            let p = { x: 40, y: 140, w: 30, h: 30, vy: 0, gravity: 0.6, jump: -9.5, grounded: true };
            let obstacles = [];
            let score = 0;
            let highScore = localStorage.getItem('verbhero_highscore') || 0;
            let gameOver = false;

            window.onkeydown = (e) => { if(e.code === 'Space') jumpAction(); };
            canvas.onclick = jumpAction;

            function jumpAction() {
                if (p.grounded && !gameOver) { p.vy = p.jump; p.grounded = false; }
                if (gameOver) startRunner();
            }

            if(window.currentGameInterval) clearInterval(window.currentGameInterval);
            
            window.currentGameInterval = setInterval(() => {
                if (gameOver) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Viel langsamere und sanftere Geschwindigkeitssteigerung, damit 200+ Punkte leicht machbar sind
                let gameSpeed = 2.4 + Math.min(score / 300, 3.0);

                p.vy += p.gravity;
                p.y += p.vy;
                if (p.y > 140) { p.y = 140; p.vy = 0; p.grounded = true; }

                ctx.fillStyle = '#f8fafc';
                ctx.font = '28px sans-serif';
                ctx.fillText('♞', p.x, p.y + 24);

                // Hindernisse kommen in etwas größeren Abständen
                if (Math.random() < (0.009 + Math.min(score / 15000, 0.006))) {
                    obstacles.push({ x: 320, y: 145, w: 25, h: 25, type: ['♙','♖','♗'][Math.floor(Math.random()*3)] });
                }

                obstacles.forEach((obs) => {
                    obs.x -= gameSpeed;
                    ctx.fillText(obs.type, obs.x, obs.y + 22);
                    if (p.x < obs.x + obs.w && p.x + p.w > obs.x && p.y < obs.y + obs.h && p.y + p.h > obs.y) {
                        gameOver = true;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('verbhero_highscore', highScore);
                        }
                    }
                });

                obstacles = obstacles.filter(obs => obs.x > -40);
                score++;

                ctx.fillStyle = '#fff';
                ctx.font = '13px Fredoka';
                ctx.fillText("Score: " + score, 15, 22);
                ctx.fillText("Highscore: " + highScore, 15, 40);

                if(gameOver) {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px Fredoka';
                    ctx.fillText("Game Over!", 115, 75);
                    ctx.fillText("Score: " + score, 125, 100);
                    ctx.fillStyle = '#facc15';
                    ctx.fillText("Highscore: " + highScore, 105, 122);
                    ctx.font = '11px Fredoka';
                    ctx.fillStyle = '#cbd5e1';
                    ctx.fillText("Tippen für Neustart (Kosten: 1 🪙)", 60, 160);
                }
            }, 1000/60);
        }

        updateHUD();
    </script>
</body>
</html>
