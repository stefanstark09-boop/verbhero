<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerbHero - Vokabeltrainer</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        body { font-family: 'Fredoka', sans-serif; background-color: #f8fafc; color: #1e293b; user-select: none; }
        .arcade-btn { transition: all 0.1s ease; box-shadow: 0 4px 0 #cbd5e1; cursor: pointer; }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e1; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

    <!-- HEADER / DASHBOARD -->
    <header class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex justify-between items-center mb-4">
        <div>
            <h1 class="text-xl font-bold text-indigo-600">VerbHero 🦸‍♂️</h1>
            <p class="text-xs text-slate-400" id="current-selection-label">Hauptmenü</p>
        </div>
        <div class="flex gap-2">
            <div class="bg-amber-50 border border-amber-200 px-3 py-1 rounded-xl flex items-center gap-1">
                <span class="text-amber-500 font-bold" id="xp-display">0</span>
                <span class="text-xs text-amber-600 uppercase font-bold">XP</span>
            </div>
            <div class="bg-purple-50 border border-purple-200 px-3 py-1 rounded-xl flex items-center gap-1">
                <span class="text-purple-600 font-bold" id="token-display">0</span>
                <span class="text-xs text-purple-600">🪙</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main id="app-container" class="flex-1 flex flex-col justify-center">
        
        <!-- 1. STARTSEITE: Hauptauswahl (Lernen oder Games) -->
        <div id="main-select-screen" class="space-y-3">
            <h2 class="text-center text-slate-600 font-bold mb-3">Was möchtest du machen?</h2>
            
            <button onclick="selectCategory('verbs')" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>⚡ Irregular Verbs</span>
                <span class="text-sm bg-indigo-700 px-2 py-1 rounded-lg">82 Verben</span>
            </button>
            <button onclick="selectCategory('unit1')" class="w-full bg-teal-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>📚 Vokabeln: Unit 1</span>
                <span class="text-sm bg-teal-600 px-2 py-1 rounded-lg">Schule & Alltag</span>
            </button>
            <button onclick="selectCategory('unit2')" class="w-full bg-cyan-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>📚 Vokabeln: Unit 2</span>
                <span class="text-sm bg-cyan-600 px-2 py-1 rounded-lg">Hobby & Freizeit</span>
            </button>
            <button onclick="selectCategory('mixed')" class="w-full bg-amber-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🔀 Gemischt</span>
                <span class="text-sm bg-amber-600 px-2 py-1 rounded-lg">Alles durcheinander</span>
            </button>
            <button onclick="openGamesMenu()" class="w-full bg-rose-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6 mt-2">
                <span>🕹️ Games (Arcade)</span>
                <span class="text-sm bg-rose-600 px-2 py-1 rounded-lg">1 🪙 Token</span>
            </button>
        </div>

        <!-- 2. SPIELMODUS-AUSWAHL: Nach der Kategoriewahl -->
        <div id="game-select-screen" class="hidden space-y-3">
            <h2 class="text-center text-slate-600 font-bold mb-3">Wähle deinen Übungsmodus!</h2>
            
            <button onclick="startLearningGame('match')" class="w-full bg-indigo-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🧩 Triple Match</span>
                <span class="text-sm bg-indigo-600 px-2 py-1 rounded-lg">Match</span>
            </button>
            <button id="matrix-mode-btn" onclick="startLearningGame('matrix')" class="w-full bg-violet-600 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🔢 3x3 Matrix</span>
                <span class="text-sm bg-violet-700 px-2 py-1 rounded-lg">3er-Trios finden</span>
            </button>
            <button onclick="startLearningGame('detective')" class="w-full bg-emerald-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🔍 Lücken-Detektiv</span>
                <span class="text-sm bg-emerald-600 px-2 py-1 rounded-lg">Sätze</span>
            </button>
            <button onclick="startLearningGame('listening')" class="w-full bg-sky-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>🎧 Hör-Trainer</span>
                <span class="text-sm bg-sky-600 px-2 py-1 rounded-lg">Audio</span>
            </button>
        </div>

        <!-- 3. GAMES-MENÜ: Liste der Arcade-Spiele -->
        <div id="games-menu-screen" class="hidden space-y-3">
            <h2 class="text-center text-slate-600 font-bold mb-3">Arcade-Spiele</h2>
            
            <button onclick="startRunner()" class="w-full bg-rose-500 text-white p-4 rounded-2xl font-bold text-lg arcade-btn flex items-center justify-between px-6">
                <span>♞ Springer Arcade</span>
                <span class="text-sm bg-rose-600 px-2 py-1 rounded-lg">1 🪙</span>
            </button>
        </div>

        <!-- 4. SPIELBEREICH -->
        <div id="game-screen" class="hidden flex flex-col items-center justify-center"></div>
    </main>

    <!-- FOOTER NAVIGATION -->
    <footer class="mt-4 flex justify-between items-center px-2">
        <button onclick="returnToMain()" id="back-btn" class="text-sm bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold hidden">⬅️ Zurück</button>
        <p class="text-xs text-slate-400 ml-auto">VerbHero PWA</p>
    </footer>

    <!-- JAVASCRIPT LOGIK -->

        function speakWord(text) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.log('Audio Error:', e);
            }
        }

				{ base: "speak", past: "spoke", pp: "spoken", de: "sprechen", sentence: "Does anyone here ___ German?" },
				{ base: "spend", past: "spent", pp: "spent", de: "verbringen; ausgeben", sentence: "We ___ three weeks in Spain." },
				{ base: "stand", past: "stood", pp: "stood", de: "stehen", sentence: "Everyone had to ___ up when the teacher entered." },

				{ base: "swim", past: "swam", pp: "swum", de: "schwimmen", sentence: "Can you ___ across the lake?" },
				{ base: "take", past: "took", pp: "taken", de: "nehmen; bringen", sentence: "Don't forget to ___ an umbrella with you." },
				{ base: "teach", past: "taught", pp: "taught", de: "lehren; unterrichten", sentence: "She will ___ us English history." },
				{ base: "tell", past: "told", pp: "told", de: "sagen; erzählen", sentence: "Can you ___ me a bedtime story?" },
				{ base: "think", past: "thought", pp: "thought", de: "denken", sentence: "What do you ___ about this idea?" },
				{ base: "throw", past: "threw", pp: "thrown", de: "werfen", sentence: "He will ___ the ball to his friend." },

            unit1: [
                { base: "schoolbag", target: "schoolbag", de: "Schultasche", sentence: "I put books in my ___." },

                { base: "rubber", target: "rubber", de: "Radiergummi", sentence: "I need a ___ to fix mistakes." },
                { base: "ruler", target: "ruler", de: "Lineal", sentence: "Draw a line with a ___." },

        let currentCategory = 'verbs';
        let currentItems = wordPools.verbs;
        let selectedGame = 'match';
        let state = { xp: 0, tokens: 0 };

        function selectCategory(categoryKey) {
            currentCategory = categoryKey;
            if (categoryKey === 'mixed') {
                currentItems = [...wordPools.verbs, ...wordPools.unit1, ...wordPools.unit2];
            } else {
                currentItems = wordPools[categoryKey];
            }

            const matrixBtn = document.getElementById('matrix-mode-btn');
            if (categoryKey === 'verbs') {
                matrixBtn.classList.remove('hidden');
            } else {
                matrixBtn.classList.add('hidden');
            }

            let catName = categoryKey === 'verbs' ? 'Irregular Verbs' : categoryKey === 'mixed' ? 'Gemischt' : categoryKey.toUpperCase();
            document.getElementById('current-selection-label').innerText = catName;

            document.getElementById('main-select-screen').classList.add('hidden');
            document.getElementById('game-select-screen').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
        }

        function openGamesMenu() {
            document.getElementById('main-select-screen').classList.add('hidden');
            document.getElementById('games-menu-screen').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('current-selection-label').innerText = "Arcade Games";
        }

        function startLearningGame(gameMode) {
            selectedGame = gameMode;
            document.getElementById('game-select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            if (selectedGame === 'match') initMatchGame();
            else if (selectedGame === 'matrix') initMatrixGame();
            else if (selectedGame === 'detective') initDetectiveGame();
            else if (selectedGame === 'listening') initListeningGame();
        }

        function returnToMain() {
            document.getElementById('main-select-screen').classList.remove('hidden');
            document.getElementById('game-select-screen').classList.add('hidden');
            document.getElementById('games-menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('current-selection-label').innerText = "Hauptmenü";
            if(window.currentGameInterval) clearInterval(window.currentGameInterval);
        }

        function addXP(xpEarned) {
            let previousTokens = Math.floor(state.xp / 100);
            state.xp += xpEarned;
            let currentTokens = Math.floor(state.xp / 100);
            if (currentTokens > previousTokens) {
                state.tokens += (currentTokens - previousTokens);
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('xp-display').innerText = state.xp;
            document.getElementById('token-display').innerText = state.tokens;
        }

        function initMatrixGame() {
            const container = document.getElementById('game-screen');
            let chosenVerbs = [];
            let usedWords = new Set();
            let shuffledPool = [...wordPools.verbs].sort(() => Math.random() - 0.5);

            for (let v of shuffledPool) {
                if (chosenVerbs.length >= 3) break;
                let forms = [v.base, v.past, v.pp];
                if (!forms.some(f => usedWords.has(f))) {
                    chosenVerbs.push(v);
                    forms.forEach(f => usedWords.add(f));
                }
            }

            let tiles = [];
            chosenVerbs.forEach((verb, verbIndex) => {
                tiles.push({ text: verb.base, groupId: verbIndex, solved: false });
                tiles.push({ text: verb.past, groupId: verbIndex, solved: false });
                tiles.push({ text: verb.pp, groupId: verbIndex, solved: false });
            });

            tiles.sort(() => Math.random() - 0.5);

            let selectedIndices = [];
            let solvedGroups = 0;
            let isChecking = false;

            function renderMatrix() {
                container.innerHTML = `
                    <div class="text-center space-y-3 w-full">
                        <h3 class="font-bold text-slate-700">Finde die 3 zusammengehörigen Verb-Trios!</h3>
                        <p class="text-xs text-slate-400">Tippe jeweils 3 Formen eines Verbs an (${solvedGroups}/3 gelöst)</p>
                        <div class="grid grid-cols-3 gap-2.5 mt-3" id="matrix-grid"></div>
                    </div>
                `;

                const grid = document.getElementById('matrix-grid');

                tiles.forEach((tile, idx) => {
                    const btn = document.createElement('button');
                    let baseClasses = "h-20 rounded-2xl font-bold text-sm px-1 flex items-center justify-center text-center transition-all border-2 ";

                    if (tile.solved) {
                        btn.className = baseClasses + "bg-emerald-100 border-emerald-400 text-emerald-800 opacity-75 cursor-default";
                    } else if (selectedIndices.includes(idx)) {
                        btn.className = baseClasses + "bg-indigo-600 border-indigo-700 text-white scale-95 shadow-inner";
                    } else {
                        btn.className = baseClasses + "bg-white border-slate-200 text-slate-700 hover:border-indigo-400 arcade-btn";
                    }

                    btn.innerText = tile.text;

                    btn.onclick = () => {
                        if (tile.solved || isChecking) return;

                        if (selectedIndices.includes(idx)) {
                            selectedIndices = selectedIndices.filter(i => i !== idx);
                            renderMatrix();
                            return;
                        }

                        selectedIndices.push(idx);
                        renderMatrix();

                        if (selectedIndices.length === 3) {
                            isChecking = true;
                            const firstGroup = tiles[selectedIndices[0]].groupId;
                            const allMatch = selectedIndices.every(i => tiles[i].groupId === firstGroup);

                            if (allMatch) {
                                setTimeout(() => {
                                    selectedIndices.forEach(i => tiles[i].solved = true);
                                    selectedIndices = [];
                                    solvedGroups++;
                                    isChecking = false;

                                    if (solvedGroups === 3) {
                                        addXP(25);
                                        setTimeout(() => initMatrixGame(), 500);
                                    } else {
                                        renderMatrix();
                                    }
                                }, 300);
                            } else {
                                const buttons = grid.querySelectorAll('button');
                                selectedIndices.forEach(i => {
                                    buttons[i].classList.remove('bg-indigo-600', 'border-indigo-700');
                                    buttons[i].classList.add('bg-rose-500', 'border-rose-600');
                                });

                                setTimeout(() => {
                                    selectedIndices = [];
                                    isChecking = false;
                                    renderMatrix();
                                }, 600);
                            }
                        }
                    };

                    grid.appendChild(btn);
                });
            }

            renderMatrix();
        }

        function initMatchGame() {
            const container = document.getElementById('game-screen');
            const item = currentItems[Math.floor(Math.random() * currentItems.length)];

            if (item.past) {
                let correctCombination = `${item.base} ➔ ${item.past} ➔ ${item.pp}`;

                container.innerHTML = `
                    <div class="text-center space-y-4 w-full">
                        <h3 class="font-bold text-slate-700">Finde die 3 Formen für: <span class="text-indigo-600 text-xl">${item.de}</span></h3>
                        <div class="grid grid-cols-1 gap-2 mt-4" id="options"></div>
                    </div>
                `;

                const optionsContainer = document.getElementById('options');
                let choices = [correctCombination];
                while(choices.length < 4) {
                    let r1 = currentItems[Math.floor(Math.random() * currentItems.length)];
                    if (r1.past) {
                        let combo = `${r1.base} ➔ ${r1.past} ➔ ${r1.pp}`;
                        if(!choices.includes(combo)) choices.push(combo);
                    }
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "bg-white border-2 border-slate-200 p-3 rounded-2xl font-bold text-sm hover:border-indigo-500 arcade-btn w-full";
                    btn.innerText = choice;
                    btn.onclick = () => {
                        if(choice === correctCombination) {
                            addXP(15);
                            initMatchGame();
                        } else {
                            btn.classList.add('bg-rose-50', 'border-rose-300');
                        }
                    };
                    optionsContainer.appendChild(btn);
                });

            } else {
                container.innerHTML = `
                    <div class="text-center space-y-4 w-full">
                        <h3 class="font-bold text-slate-700">Finde die Übersetzung für: <span class="text-indigo-600 text-xl">${item.de}</span></h3>
                        <div class="grid grid-cols-2 gap-3 mt-4" id="options"></div>
                    </div>
                `;

                const optionsContainer = document.getElementById('options');
                let choices = [item.target];
                while(choices.length < 4) {
                    let randomItem = currentItems[Math.floor(Math.random() * currentItems.length)];
                    if (randomItem.target && !choices.includes(randomItem.target)) {
                        choices.push(randomItem.target);
                    }
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "bg-white border-2 border-slate-200 p-4 rounded-2xl font-bold text-lg hover:border-indigo-500 arcade-btn";
                    btn.innerText = choice;
                    btn.onclick = () => {
                        if(choice === item.target) {
                            addXP(10);
                            initMatchGame();
                        } else {
                            btn.classList.add('bg-rose-50', 'border-rose-300');
                        }
                    };
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function initDetectiveGame() {
            const container = document.getElementById('game-screen');
            const item = currentItems[Math.floor(Math.random() * currentItems.length)];
            let targetValue = item.past ? item.past : item.target;
            
            container.innerHTML = `
                <div class="text-center space-y-4 w-full">
                    <h3 class="font-bold text-slate-700">Setze das Wort ein (${item.de}):</h3>
                    <div class="text-xl font-bold text-indigo-600 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">${item.sentence}</div>
                    <div class="grid grid-cols-2 gap-3 mt-4" id="detective-options"></div>
                </div>
            `;

            const optionsContainer = document.getElementById('detective-options');
            let choices = [targetValue];
            while(choices.length < 4) {
                let rItem = currentItems[Math.floor(Math.random() * currentItems.length)];
                let val = rItem.past ? rItem.past : rItem.target;
                if(val && !choices.includes(val)) choices.push(val);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-slate-200 p-4 rounded-2xl font-bold text-lg hover:border-emerald-500 arcade-btn";
                btn.innerText = choice;
                btn.onclick = () => {
                    if(choice === targetValue) {
                        addXP(15);
                        initDetectiveGame();
                    } else {
                        btn.classList.add('bg-rose-50', 'border-rose-300');
                    }
                };
                optionsContainer.appendChild(btn);
            });
        }

        function initListeningGame() {
            const container = document.getElementById('game-screen');
            const item = currentItems[Math.floor(Math.random() * currentItems.length)];
            
            container.innerHTML = `
                <div class="text-center space-y-4 w-full">
                    <h3 class="font-bold text-slate-700">Welches Wort hörst du?</h3>
                    <button onclick="speakWord('${item.base}')" class="bg-indigo-600 text-white p-6 rounded-full text-3xl shadow-lg mx-auto w-24 h-24 flex items-center justify-center arcade-btn">🔊</button>
                    <div class="grid grid-cols-2 gap-3 mt-4" id="listening-options"></div>
                </div>
            `;
            setTimeout(() => speakWord(item.base), 300);

            const optionsContainer = document.getElementById('listening-options');
            let choices = [item.base];
            while(choices.length < 4) {
                let r = currentItems[Math.floor(Math.random() * currentItems.length)].base;
                if(!choices.includes(r)) choices.push(r);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-slate-200 p-3 rounded-2xl font-bold text-sm hover:border-sky-500 arcade-btn";
                btn.innerText = choice;
                btn.onclick = () => {
                    if(choice === item.base) {
                        addXP(15);
                        initListeningGame();
                    } else {
                        btn.classList.add('bg-rose-50', 'border-rose-300');
                    }
                };
                optionsContainer.appendChild(btn);
            });
        }

        function startRunner() {
            if (state.tokens < 1) {
                alert("Du brauchst mindestens 1 🪙 Token, um Springer Arcade zu spielen!\n\nLerne zuerst Vokabeln, um XP und Token zu sammeln!");
                return;
            }
            state.tokens--;
            updateHUD();

            document.getElementById('main-select-screen').classList.add('hidden');
            document.getElementById('games-menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('current-selection-label').innerText = "Springer Arcade 🪙";

            initRunnerGame();
        }

        function initRunnerGame() {
            const container = document.getElementById('game-screen');
            container.innerHTML = `
                <div class="text-center w-full">
                    <canvas id="runnerCanvas" width="320" height="200" class="bg-slate-900 rounded-2xl shadow-inner mx-auto border-4 border-slate-800"></canvas>
                    <p class="text-xs text-slate-400 mt-2">Tippe oder Leertaste zum Springen (Doppelsprung möglich)!</p>
                </div>
            `;
            const canvas = document.getElementById('runnerCanvas');
            const ctx = canvas.getContext('2d');
            
            // Spieler-Objekt mit Doppelsprung-Zähler (jumpCount)
            let p = { x: 40, y: 140, w: 30, h: 30, vy: 0, gravity: 0.55, jump: -9.0, jumpCount: 0, maxJumps: 2 };
            let obstacles = [];
            let score = 0;
            let highScore = localStorage.getItem('verbhero_highscore') || 0;
            let gameOver = false;

            window.onkeydown = (e) => { if(e.code === 'Space') jumpAction(); };
            canvas.onclick = jumpAction;

            function jumpAction() {
                if (gameOver) {
                    startRunner();
                    return;
                }
                // Erlaubt Sprung am Boden oder einen zweiten Sprung in der Luft
                if (p.jumpCount < p.maxJumps) {
                    p.vy = p.jump;
                    p.jumpCount++;
                }
            }

            if(window.currentGameInterval) clearInterval(window.currentGameInterval);
            
            window.currentGameInterval = setInterval(() => {
                if (gameOver) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let gameSpeed = 2.4 + Math.min(score / 350, 2.8);

                p.vy += p.gravity;
                p.y += p.vy;

                // Boden-Kollision
                if (p.y > 140) {
                    p.y = 140;
                    p.vy = 0;
                    p.jumpCount = 0; // Sprünge zurücksetzen, wenn man landetet
                }

                ctx.fillStyle = '#f8fafc';
                ctx.font = '28px sans-serif';
                ctx.fillText('♞', p.x, p.y + 24);

                if (Math.random() < (0.008 + Math.min(score / 18000, 0.005))) {
                    obstacles.push({ x: 320, y: 145, w: 25, h: 25, type: ['♙','♖','♗'][Math.floor(Math.random()*3)] });
                }

                obstacles.forEach((obs) => {
                    obs.x -= gameSpeed;
                    ctx.fillText(obs.type, obs.x, obs.y + 22);
                    if (p.x < obs.x + obs.w && p.x + p.w > obs.x && p.y < obs.y + obs.h && p.y + p.h > obs.y) {
                        gameOver = true;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('verbhero_highscore', highScore);
                        }
                    }
                });

                obstacles = obstacles.filter(obs => obs.x > -40);
                score++;

                ctx.fillStyle = '#fff';
                ctx.font = '13px Fredoka';
                ctx.fillText("Score: " + score, 15, 22);
                ctx.fillText("Highscore: " + highScore, 15, 40);

                if(gameOver) {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px Fredoka';
                    ctx.fillText("Game Over!", 115, 75);
                    ctx.fillText("Score: " + score, 125, 100);
                    ctx.fillStyle = '#facc15';
                    ctx.fillText("Highscore: " + highScore, 105, 122);
                    ctx.font = '11px Fredoka';
                    ctx.fillStyle = '#cbd5e1';
                    ctx.fillText("Tippen für Neustart (Kosten: 1 🪙)", 60, 160);
                }
            }, 1000/60);
        }

        updateHUD();
    </script>
